<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>反應遊戲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* Layout: a night-shift toy-factory arcade. Menu card first, then a hazard-striped frame around a 3x4 board of holes with the HUD on top. Single deliberate dark look. */
:root{
  --night:#1C1940; --night-dot:#26225200;
  --panel:#2B2657; --panel-2:#3A3474;
  --board:#2E8C7E; --board-hi:#3AA391; --pit:#110F28; --pit-rim:#1F6E63;
  --trim:#FFC93C; --trim-dk:#C9921A;
  --cream:#FFF4E0; --muted:#BDB6E6;
  --good:#8CF08C; --bad:#FF6B5B; --bad-dk:#C9473A;
  --arm:#9B6BFF; --arm-dk:#6A43C8; --arm-hi:#C4A8FF;
  --ghost-glow:rgba(214,226,255,.85);
  --scrim:rgba(17,15,40,.86);
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--night);
  background-image:radial-gradient(circle at 1px 1px, var(--panel) 1.5px, transparent 0);
  background-size:22px 22px;
  color:var(--cream); font-family:var(--f-body); font-size:16px; line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
.app{
  min-height:100%; display:flex; flex-direction:column; align-items:center;
  padding-block:18px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{width:100%; max-width:560px; display:flex; flex-direction:column; gap:18px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--trim); outline-offset:3px}

/* ---------- Menu ---------- */
.head{display:flex; flex-direction:column; gap:4px}
.eyebrow{font-size:13px; letter-spacing:.12em; color:var(--trim); font-weight:700}
h1{
  margin:0; font-family:var(--f-display); font-weight:900;
  font-size:clamp(44px, 13vw, 68px); line-height:1.05; letter-spacing:.04em; text-wrap:balance;
}
.stripe{height:10px; width:150px; border-radius:5px;
  background:repeating-linear-gradient(45deg,var(--trim) 0 10px,var(--pit) 10px 20px)}
.how{margin:0; font-size:18px; max-width:32em}
.how b{color:var(--trim)}

.rules{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.rule{
  background:var(--panel); border:2px solid var(--panel-2); border-radius:16px;
  padding:12px 8px 10px; display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center;
}
.rule .icon{width:64px; height:64px; display:grid; place-items:center}
.rule .icon svg{width:100%; height:100%}
.rule .pts{font-family:var(--f-num); font-weight:800; font-size:30px; line-height:1}
.rule .pts.plus{color:var(--good)} .rule .pts.minus{color:var(--bad)}
.rule .name{font-weight:700; font-size:15px}
.rule .note{font-size:13px; color:var(--muted)}

.pick{display:flex; flex-direction:column; gap:8px}
.pick h2{margin:0; font-size:15px; letter-spacing:.08em; color:var(--muted); font-weight:700}
.chips{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.chip{
  background:var(--panel); border:2px solid var(--panel-2); border-radius:14px;
  padding:10px 6px; display:flex; flex-direction:column; align-items:center; line-height:1.25;
}
.chip .big{font-weight:900; font-size:19px}
.chip .small{font-size:12.5px; color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--trim); border-color:var(--trim); color:var(--pit)}
.chip[aria-pressed="true"] .small{color:var(--pit)}

.go{
  background:var(--bad); color:var(--cream); border:0; border-radius:20px;
  font-family:var(--f-display); font-weight:900; font-size:30px; letter-spacing:.2em;
  padding:14px 0 16px; box-shadow:0 7px 0 var(--bad-dk); transition:transform .08s, box-shadow .08s;
}
.go:active{transform:translateY(5px); box-shadow:0 2px 0 var(--bad-dk)}
.best{margin:0; text-align:center; color:var(--muted); font-size:14px}
.best b{font-family:var(--f-num); color:var(--cream); font-size:18px}
.foot{margin:0; font-size:13px; color:var(--muted); text-align:center; text-wrap:balance}

/* ---------- Game ---------- */
.hud{display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:stretch}
.stat{background:var(--panel); border-radius:14px; padding:6px 12px; display:flex; flex-direction:column; line-height:1.1}
.stat .lab{font-size:12px; color:var(--muted); letter-spacing:.1em}
.stat .val{font-family:var(--f-num); font-weight:800; font-size:32px; font-variant-numeric:tabular-nums}
.stat .val.bump{animation:bump .25s}
.stat.hurry .val{color:var(--bad); animation:pulse .5s infinite alternate}
.tools{display:flex; gap:6px}
.tool{background:var(--panel); border:2px solid var(--panel-2); border-radius:14px; padding:0 12px; font-size:14px; font-weight:700}
.bar{height:8px; border-radius:4px; background:var(--panel); overflow:hidden}
.bar i{display:block; height:100%; background:var(--trim); transform-origin:left; transform:scaleX(1)}

.frame{
  position:relative; align-self:center;
  width:min(100%, 520px, calc((100vh - 190px) * .82));
  width:min(100%, 520px, calc((100dvh - 190px) * .82));
  padding:9px; border-radius:24px;
  background:repeating-linear-gradient(45deg,var(--trim) 0 14px,var(--pit) 14px 28px);
}
.board{
  position:relative; overflow:hidden; border-radius:16px;
  background:linear-gradient(180deg,var(--board-hi),var(--board));
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; padding:10px 10px 4px;
  touch-action:manipulation; user-select:none; -webkit-user-select:none;
}
body.mouse .board{cursor:none}
.hole{position:relative; aspect-ratio:1/.92; max-width:100%}
.pit-back,.pit-front{
  position:absolute; left:8%; right:8%; bottom:6%; height:28%; border-radius:50%;
  background:var(--pit);
}
.pit-back{box-shadow:inset 0 6px 0 rgba(0,0,0,.35), 0 0 0 4px var(--pit-rim)}
.pit-front{clip-path:inset(50% -6px -6px -6px); box-shadow:0 4px 0 var(--pit-rim); z-index:2}
.mask{position:absolute; left:0; right:0; top:0; bottom:20%; overflow:hidden; z-index:1; pointer-events:none}
.pop{
  position:absolute; left:16%; right:16%; bottom:0; height:82%;
  transform:translateY(104%); transition:transform .17s ease-out;
}
.pop svg{width:100%; height:100%; display:block; transform-origin:50% 100%}
.hole.up .pop{transform:translateY(0)}
.hole.is-ghost .pop svg{filter:drop-shadow(0 0 8px var(--ghost-glow))}
.stars{position:absolute; left:0; right:0; top:2%; text-align:center; color:var(--trim);
  font-size:18px; letter-spacing:.3em; opacity:0; pointer-events:none}
.hole.bonk .pop svg{animation:squash .32s ease-out forwards}
.hole.bonk .stars{opacity:1; animation:spin .6s linear infinite}
.hole.laugh .pop svg{animation:wobble .35s ease-in-out 2}

.arm-layer{position:absolute; inset:0; width:100%; height:100%; z-index:5; pointer-events:none; overflow:visible}
.arm-outer{fill:none; stroke:var(--arm-dk); stroke-width:32; stroke-linecap:round}
.arm-inner{fill:none; stroke:var(--arm); stroke-width:22; stroke-linecap:round}
.arm-shine{fill:none; stroke:var(--arm-hi); stroke-width:5; stroke-linecap:round; opacity:.75}
.hammer.grabbed svg{animation:shake .3s}

.float{position:absolute; z-index:8; pointer-events:none; font-family:var(--f-num); font-weight:800; font-size:34px;
  translate:-50% -50%; animation:rise .7s ease-out forwards; text-shadow:0 3px 0 var(--pit)}
.float.plus{color:var(--good)} .float.minus{color:var(--bad)}
.float.small{font-family:var(--f-display); font-size:20px; white-space:nowrap}

.overlay{position:absolute; inset:0; z-index:20; border-radius:24px; background:var(--scrim);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px; text-align:center}
.count{font-family:var(--f-display); font-weight:900; font-size:96px; color:var(--trim); line-height:1}
.count.word{font-size:54px}
.over h2{margin:0; font-family:var(--f-display); font-size:26px; font-weight:900}
.over .score{font-family:var(--f-num); font-weight:800; font-size:76px; line-height:1; color:var(--trim)}
.over .record{color:var(--good); font-weight:900; font-size:18px}
.tally{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; font-size:16px}
.tally b{font-family:var(--f-num); font-size:19px}
.over .btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px}
.over .go{font-size:22px; letter-spacing:.1em; padding:10px 22px 12px}
.ghostbtn{background:var(--panel); border:2px solid var(--panel-2); border-radius:18px; padding:10px 18px; font-weight:700}

.hammer{position:fixed; left:0; top:0; width:110px; height:110px; z-index:50; pointer-events:none;
  transform-origin:50% 96%; rotate:28deg}
.hammer svg{width:100%; height:100%; display:block}
.hammer.swing{animation:swing .2s ease-out}

@keyframes swing{0%{rotate:28deg}40%{rotate:-10deg; scale:.94}100%{rotate:28deg}}
@keyframes squash{0%{transform:scale(1,1)}40%{transform:scale(1.2,.7)}100%{transform:scale(1.05,.8)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes grab{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(.92,1.04)}}
@keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-8px)}70%{transform:translateX(8px)}}
@keyframes rise{0%{opacity:1; transform:translateY(0) scale(.8)}20%{transform:translateY(-8px) scale(1.15)}100%{opacity:0; transform:translateY(-46px) scale(1)}}
@keyframes bump{50%{transform:scale(1.18)}}
@keyframes pulse{to{opacity:.55}}
@media (prefers-reduced-motion:reduce){
  .hand.out .palm,.hole.bonk .stars,.stat.hurry .val{animation:none}
  .pop{transition-duration:.08s}
}
@media (max-width:380px){
  .rule .icon{width:52px; height:52px}
  .stat .val{font-size:27px}
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
.chips.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tip,.err{margin:0; font-size:14px}
.tip b{color:var(--trim)}
.err{color:var(--bad); font-weight:700}
.go:disabled{opacity:.7; font-size:22px; letter-spacing:.05em}
.cam{position:fixed; right:max(12px, env(safe-area-inset-right, 0px)); bottom:max(12px, env(safe-area-inset-bottom, 0px));
  width:170px; aspect-ratio:4/3; object-fit:cover; transform:scaleX(-1); border:4px solid var(--trim); border-radius:14px; z-index:40; background:var(--pit)}
.camstate{position:fixed; right:max(12px, env(safe-area-inset-right, 0px)); bottom:calc(max(12px, env(safe-area-inset-bottom, 0px)) + 140px);
  width:170px; text-align:center; z-index:41; background:var(--panel); color:var(--cream); border:2px solid var(--panel-2);
  border-radius:10px; padding:3px 0; font-weight:900; font-size:15px}
.camstate[data-s="握拳"]{background:var(--bad); border-color:var(--bad)}
.camstate[data-s="張開"]{background:var(--board); border-color:var(--board)}
.camhint{position:absolute; left:50%; top:12px; translate:-50% 0; z-index:9; background:var(--scrim); color:var(--cream);
  padding:6px 14px; border-radius:999px; font-weight:700; pointer-events:none; white-space:nowrap}
</style>
</head>
<body>

<div class="app">
  <div class="wrap">

    <!-- MENU -->
    <section id="menu" class="wrap">
      <div class="head">
        <span class="eyebrow">小設計師的原創遊戲</span>
        <h1>反應遊戲</h1>
        <div class="stripe" aria-hidden="true"></div>
      </div>
      <p class="how">拿起<b>鎚子</b>，玩偶從洞裡跑出來，就把它<b>打回洞裡</b>！</p>

      <div class="rules">
        <div class="rule">
          <div class="icon" data-art="orange"></div>
          <div class="pts plus">+4</div>
          <div class="name">玩偶</div>
          <div class="note">要打它</div>
        </div>
        <div class="rule">
          <div class="icon" data-art="ghost"></div>
          <div class="pts minus">−2</div>
          <div class="name">幽靈</div>
          <div class="note">不能打</div>
        </div>
        <div class="rule">
          <div class="icon" data-art="handIcon"></div>
          <div class="pts minus">−2</div>
          <div class="name">搗蛋手</div>
          <div class="note">會來搶鎚子</div>
        </div>
      </div>

      <div class="pick">
        <h2>操作方式</h2>
        <div class="chips two" id="modeChips">
          <button class="chip" id="m-mouse" data-mode="mouse" aria-pressed="true"><span class="big">滑鼠模式</span><span class="small">用滑鼠或手指點</span></button>
          <button class="chip" id="m-cam" data-mode="cam" aria-pressed="false"><span class="big">體感模式</span><span class="small">用相機看你的手</span></button>
        </div>
        <p class="tip" id="camTip" hidden>站在鏡頭前，<b>張開手</b>移動鎚子，對準玩偶後<b>握拳</b>就是敲。第一次開啟要等幾秒鐘。</p>
        <p class="err" id="camErr" hidden></p>
      </div>

      <div class="pick">
        <h2>難度</h2>
        <div class="chips" id="diffChips">
          <button class="chip" id="d-easy" data-diff="easy" aria-pressed="true"><span class="big">簡單</span><span class="small">慢慢出來</span></button>
          <button class="chip" id="d-normal" data-diff="normal" aria-pressed="false"><span class="big">普通</span><span class="small">有點快</span></button>
          <button class="chip" id="d-hard" data-diff="hard" aria-pressed="false"><span class="big">困難</span><span class="small">超級快</span></button>
        </div>
      </div>

      <div class="pick">
        <h2>時間</h2>
        <div class="chips" id="timeChips">
          <button class="chip" id="t-60" data-time="60" aria-pressed="true"><span class="big">60秒</span><span class="small">1分鐘</span></button>
          <button class="chip" id="t-120" data-time="120" aria-pressed="false"><span class="big">120秒</span><span class="small">2分鐘</span></button>
          <button class="chip" id="t-180" data-time="180" aria-pressed="false"><span class="big">180秒</span><span class="small">3分鐘</span></button>
        </div>
      </div>

      <button class="go" id="startBtn">開始</button>
      <p class="best" id="bestLine">這一關的最高分：<b>還沒有</b></p>
      <p class="foot">現在的玩偶是暫時的替身，等設計師把新角色畫好就換上。</p>
    </section>

    <!-- GAME -->
    <section id="game" class="wrap" hidden>
      <div class="hud">
        <div class="stat"><span class="lab">分數</span><span class="val" id="scoreVal">0</span></div>
        <div class="stat" id="timeBox"><span class="lab">剩下（秒）</span><span class="val" id="timeVal">60</span></div>
        <div class="tools">
          <button class="tool" id="soundBtn" aria-pressed="true">聲音開</button>
          <button class="tool" id="quitBtn">結束</button>
        </div>
      </div>
      <div class="bar" aria-hidden="true"><i id="barFill"></i></div>

      <div class="frame">
        <div class="board" id="board">
          <svg class="arm-layer" id="armSvg" aria-hidden="true" hidden>
            <path class="arm-outer" id="armO"/><path class="arm-inner" id="armI"/><path class="arm-shine" id="armS" transform="translate(-5 -2)"/>
            <g id="palmG"><g transform="translate(-35 -72)"></g></g>
          </svg>
        </div>

        <div class="camhint" id="camHint" hidden>把手舉到鏡頭前</div>
        <div class="overlay" id="countLayer" hidden><div class="count" id="countNum">3</div></div>

        <div class="overlay over" id="overLayer" hidden>
          <h2>時間到！</h2>
          <div class="score" id="finalScore">0</div>
          <div class="record" id="recordLine" hidden>新紀錄！</div>
          <ul class="tally">
            <li>打到玩偶 <b id="tDoll">0</b> 隻</li>
            <li>打到幽靈 <b id="tGhost">0</b> 次</li>
            <li>碰到搗蛋手 <b id="tHand">0</b> 次</li>
          </ul>
          <div class="btns">
            <button class="go" id="againBtn">再玩一次</button>
            <button class="ghostbtn" id="menuBtn">換難度</button>
          </div>
        </div>
      </div>
    </section>

  </div>
</div>

<video class="cam" id="cam" playsinline muted hidden></video>
<div class="camstate" id="camState" hidden>找不到手</div>

<div class="hammer" id="hammer" hidden aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <rect x="45" y="30" width="10" height="66" rx="5" fill="#B9773E"/>
    <rect x="47" y="32" width="3" height="60" rx="1.5" fill="#D9995C"/>
    <rect x="20" y="8" width="60" height="28" rx="8" fill="#E8463A"/>
    <rect x="20" y="8" width="60" height="9" rx="4" fill="#FF7A6B"/>
    <rect x="28" y="8" width="6" height="28" fill="#FFC93C"/>
    <rect x="66" y="8" width="6" height="28" fill="#FFC93C"/>
  </svg>
</div>

<script>

      num.textContent = s; num.classList.toggle('word', i === 3); sfx.beep(i === 3);
    }, i * 650));
    later(() => { layer.hidden = true; begin(); }, steps.length * 650);
  }

  function begin() {
    measure();
    S.running = true; S.start = S.last = performance.now();
    tick();
    later(spawn, 350);
    scheduleHand();
  }

  function finish() {
    stopAll(); sfx.end();
    const best = getBest();
    const isRecord = best === null || S.score > best;
    if (isRecord) setBest(S.score);
    $('#finalScore').textContent = S.score;
    $('#recordLine').hidden = !(isRecord && S.score > 0);
    $('#tDoll').textContent = S.hits.doll;
    $('#tGhost').textContent = S.hits.ghost;
    $('#tHand').textContent = S.hits.hand;
    $('#overLayer').hidden = false;
  }

  function toMenu() {
    stopAll(); stopCamera(); onGame = false;
    $('#countLayer').hidden = true; $('#overLayer').hidden = true;
    $('#game').hidden = true; $('#menu').hidden = false;
    showBest(); window.scrollTo(0, 0);
  }

  $('#startBtn').addEventListener('click', async () => {
    ensureAudio();
    const btn = $('#startBtn'), err = $('#camErr');
    err.hidden = true;
    if (mode === 'cam') {
      btn.disabled = true; btn.textContent = '開啟相機中…';
      try { await startCamera(); }
      catch (e) {
        stopCamera();
        err.textContent = '沒辦法開啟相機：' + (e && e.name === 'NotAllowedError'
          ? '請允許這個網頁使用相機，再按一次開始。'
          : (e && e.message && !/^[A-Za-z]/.test(e.message) ? e.message : '請確認鏡頭有接好、網路有連上，再試一次。'));
        err.hidden = false; btn.disabled = false; btn.textContent = '開始';
        return;
      }
      btn.disabled = false; btn.textContent = '開始';
    } else stopCamera();
    onGame = true;
    $('#menu').hidden = true; $('#game').hidden = false; window.scrollTo(0, 0);
    newRound();
  });
  $('#againBtn').addEventListener('click', () => { ensureAudio(); newRound(); });
  $('#menuBtn').addEventListener('click', toMenu);
  $('#quitBtn').addEventListener('click', toMenu);
})();
</script>
</body>
</html>
